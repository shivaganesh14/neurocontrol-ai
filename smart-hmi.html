<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaControl AI - Smart Industrial Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modern Glass Morphism */
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        /* Header Styles */
        .header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ai-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 100px;
            color: #22c55e;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .ai-pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 73px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .nav-section {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 1rem;
        }

        .nav-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #cbd5e1;
            font-size: 0.875rem;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-left: 3px solid #3b82f6;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 1.5rem;
        }

        /* Alert Priority Cards */
        .alert-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .priority-card {
            padding: 1.25rem;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .priority-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .priority-card.critical {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .priority-card.critical::before {
            background: #ef4444;
        }

        .priority-card.high {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.1), rgba(251, 146, 60, 0.05));
            border: 1px solid rgba(251, 146, 60, 0.2);
        }

        .priority-card.high::before {
            background: #fb923c;
        }

        .priority-card.medium {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.05));
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .priority-card.medium::before {
            background: #fbbf24;
        }

        .priority-card.low {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .priority-card.low::before {
            background: #22c55e;
        }

        .priority-count {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .priority-label {
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 0.25rem;
        }

        .priority-description {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Digital Twin */
        .digital-twin {
            grid-column: 1;
            grid-row: 2;
        }

        .machine-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .machine-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .machine-card.healthy {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
            border: 2px solid rgba(34, 197, 94, 0.3);
        }

        .machine-card.warning {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.05));
            border: 2px solid rgba(251, 191, 36, 0.3);
        }

        .machine-card.critical {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 2px solid rgba(239, 68, 68, 0.3);
            animation: criticalPulse 1s infinite;
        }

        @keyframes criticalPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        .machine-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .machine-name {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .machine-status {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* AI Assistant */
        .ai-assistant {
            grid-column: 2;
            grid-row: 2;
        }

        .chat-container {
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.875rem;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex: 1;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 0.75rem;
            color: #f1f5f9;
            font-size: 0.875rem;
        }

        .chat-input button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-input button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* Predictive Analytics */
        .predictive-analytics {
            grid-column: 1 / -1;
            grid-row: 3;
        }

        .chart-container {
            height: 250px;
            margin-top: 1rem;
        }

        /* Voice Control */
        .voice-control {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .voice-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .voice-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.6);
        }

        .voice-button.listening {
            animation: voicePulse 1s infinite;
        }

        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .digital-twin, .ai-assistant {
                grid-column: 1;
            }
            
            .predictive-analytics {
                grid-row: 4;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .alert-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .machine-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(148, 163, 184, 0.1) 25%, rgba(148, 163, 184, 0.2) 50%, rgba(148, 163, 184, 0.1) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .section-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .section-action {
            font-size: 0.875rem;
            color: #3b82f6;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .section-action:hover {
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area } = Recharts;

        // Smart Industrial Command Center Component
        const SmartHMI = () => {
            const [selectedView, setSelectedView] = useState('dashboard');
            const [isListening, setIsListening] = useState(false);
            const [messages, setMessages] = useState([
                { type: 'ai', text: 'Hello! I\'m your AI assistant. I can help you analyze system performance and recommend actions. Try asking "What are the critical issues?"' }
            ]);
            const [inputMessage, setInputMessage] = useState('');
            const [currentTime, setCurrentTime] = useState(new Date());
            const chatEndRef = useRef(null);

            // AI Alert Prioritization Engine
            const [alertPriorities] = useState({
                critical: {
                    count: 2,
                    description: 'Immediate action required',
                    alerts: [
                        { id: 1, machine: 'Pump A', issue: 'Pressure overload', risk: 'Catastrophic failure' },
                        { id: 2, machine: 'Reactor 2', issue: 'Temperature spike', risk: 'Safety breach' }
                    ]
                },
                high: {
                    count: 5,
                    description: 'Address within 1 hour',
                    alerts: [
                        { id: 3, machine: 'Conveyor B', issue: 'Vibration increase', risk: 'Bearing damage' },
                        { id: 4, machine: 'Motor C', issue: 'Power fluctuation', risk: 'Efficiency loss' }
                    ]
                },
                medium: {
                    count: 8,
                    description: 'Schedule maintenance',
                    alerts: [
                        { id: 5, machine: 'Sensor D', issue: 'Calibration drift', risk: 'Data inaccuracy' }
                    ]
                },
                low: {
                    count: 12,
                    description: 'Monitor only',
                    alerts: []
                }
            });

            // Digital Twin Machine Status
            const [machines] = useState([
                { id: 1, name: 'Pump A', status: 'critical', efficiency: 45, icon: '⚙️' },
                { id: 2, name: 'Reactor 2', status: 'critical', efficiency: 62, icon: '⚗️' },
                { id: 3, name: 'Conveyor B', status: 'warning', efficiency: 78, icon: '🔄' },
                { id: 4, name: 'Motor C', status: 'warning', efficiency: 82, icon: '⚡' },
                { id: 5, name: 'Sensor D', status: 'healthy', efficiency: 95, icon: '📡' },
                { id: 6, name: 'Valve E', status: 'healthy', efficiency: 98, icon: '🔧' },
                { id: 7, name: 'Tank F', status: 'healthy', efficiency: 91, icon: '🛢️' },
                { id: 8, name: 'Heater G', status: 'healthy', efficiency: 88, icon: '🔥' },
                { id: 9, name: 'Cooler H', status: 'healthy', efficiency: 94, icon: '❄️' }
            ]);

            // Predictive Analytics Data
            const [predictiveData] = useState([
                { time: '00:00', pumpA: 85, reactor2: 92, conveyorB: 88, prediction: 90 },
                { time: '04:00', pumpA: 82, reactor2: 88, conveyorB: 85, prediction: 85 },
                { time: '08:00', pumpA: 78, reactor2: 85, conveyorB: 82, prediction: 82 },
                { time: '12:00', pumpA: 65, reactor2: 78, conveyorB: 80, prediction: 74 },
                { time: '16:00', pumpA: 55, reactor2: 70, conveyorB: 77, prediction: 67 },
                { time: '20:00', pumpA: 45, reactor2: 62, reactorB: 75, prediction: 61 },
                { time: '24:00', pumpA: 35, reactor2: 55, conveyorB: 73, prediction: 54 }
            ]);

            // AI Response Engine
            const generateAIResponse = (userMessage) => {
                const lowerMessage = userMessage.toLowerCase();
                
                if (lowerMessage.includes('critical') || lowerMessage.includes('issues')) {
                    return `I've identified ${alertPriorities.critical.count} critical issues requiring immediate attention:\n\n1. **Pump A** - Pressure overload at 45% efficiency. Risk: Catastrophic failure.\n   Recommended: Reduce pump speed by 30% and inspect discharge line.\n\n2. **Reactor 2** - Temperature spike at 62% efficiency. Risk: Safety breach.\n   Recommended: Initiate emergency cooling protocol and evacuate area.\n\nBoth systems show degradation patterns suggesting imminent failure if not addressed within 15 minutes.`;
                }
                
                if (lowerMessage.includes('pump a')) {
                    return 'Pump A is showing critical pressure readings at 45% efficiency. My analysis indicates a 78% probability of bearing failure within 2 hours based on vibration patterns and pressure fluctuations. Recommended actions: 1) Reduce load immediately, 2) Schedule emergency maintenance, 3) Check for blockages in discharge line.';
                }
                
                if (lowerMessage.includes('predict') || lowerMessage.includes('forecast')) {
                    return 'Based on current degradation patterns, I predict:\n\n- Pump A: Critical failure in 2.3 hours\n- Reactor 2: Safety threshold breach in 1.8 hours\n- Conveyor B: Bearing failure in 8.5 hours\n\nRecommended to address critical systems immediately to prevent cascade failures.';
                }
                
                return 'I can help you with system analysis, predictive maintenance, and critical issue resolution. Try asking about specific machines, critical issues, or predictive forecasts.';
            };

            // Voice Recognition
            const startVoiceRecognition = () => {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    
                    recognition.onstart = () => setIsListening(true);
                    recognition.onend = () => setIsListening(false);
                    
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInputMessage(transcript);
                        handleSendMessage(transcript);
                    };
                    
                    recognition.start();
                } else {
                    alert('Voice recognition is not supported in your browser. Please use Chrome or Edge.');
                }
            };

            // Message Handling
            const handleSendMessage = (text) => {
                if (!text.trim()) return;
                
                const userMessage = { type: 'user', text };
                setMessages(prev => [...prev, userMessage]);
                
                setTimeout(() => {
                    const aiResponse = { type: 'ai', text: generateAIResponse(text) };
                    setMessages(prev => [...prev, aiResponse]);
                }, 1000);
                
                setInputMessage('');
            };

            // Auto-scroll chat
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            // Update clock
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div>
                    {/* Header */}
                    <header className="glass-header header">
                        <div className="logo-section">
                            <div className="logo">NC</div>
                            <div className="brand-text">
                                <h1>NexaControl AI</h1>
                                <p>Smart Industrial Command Center</p>
                            </div>
                        </div>
                        
                        <div className="header-stats">
                            <div className="stat-item">
                                <div className="stat-value">94%</div>
                                <div className="stat-label">Efficiency</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">24/25</div>
                                <div className="stat-label">Systems Online</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">2</div>
                                <div className="stat-label">Critical</div>
                            </div>
                            <div className="ai-status">
                                <div className="ai-pulse"></div>
                                AI Active
                            </div>
                        </div>
                    </header>

                    <div className="main-container">
                        
                        {/* Sidebar */}
                        <aside className="sidebar">
                            <div className="nav-section">
                                <div className="nav-title">Main Navigation</div>
                                <div className={`nav-item ${selectedView === 'dashboard' ? 'active' : ''}`} onClick={() => setSelectedView('dashboard')}>
                                    📊 Dashboard
                                </div>
                                <div className={`nav-item ${selectedView === 'machines' ? 'active' : ''}`} onClick={() => setSelectedView('machines')}>
                                    🏭 Machines
                                </div>
                                <div className={`nav-item ${selectedView === 'analytics' ? 'active' : ''}`} onClick={() => setSelectedView('analytics')}>
                                    📈 Analytics
                                </div>
                                <div className={`nav-item ${selectedView === 'alerts' ? 'active' : ''}`} onClick={() => setSelectedView('alerts')}>
                                    🚨 Alerts
                                </div>
                                <div className={`nav-item ${selectedView === 'maintenance' ? 'active' : ''}`} onClick={() => setSelectedView('maintenance')}>
                                    🔧 Maintenance
                                </div>
                            </div>
                            
                            <div className="nav-section">
                                <div className="nav-title">AI Tools</div>
                                <div className={`nav-item ${selectedView === 'assistant' ? 'active' : ''}`} onClick={() => setSelectedView('assistant')}>
                                    🤖 AI Assistant
                                </div>
                                <div className={`nav-item ${selectedView === 'predictive' ? 'active' : ''}`} onClick={() => setSelectedView('predictive')}>
                                    🔮 Predictions
                                </div>
                                <div className={`nav-item ${selectedView === 'reports' ? 'active' : ''}`} onClick={() => setSelectedView('reports')}>
                                    📄 Reports
                                </div>
                            </div>
                            
                            <div className="nav-section">
                                <div className="nav-title">System</div>
                                <div className="nav-item">
                                    ⚙️ Settings
                                </div>
                                <div className="nav-item">
                                    👥 Users
                                </div>
                                <div className="nav-item">
                                    📊 Logs
                                </div>
                            </div>
                        </aside>

                        {/* Main Content */}
                        <main className="main-content">
                            
                            {/* AI Alert Prioritization */}
                            <div className="alert-grid">
                                {Object.entries(alertPriorities).map(([priority, data]) => (
                                    <div key={priority} className={`priority-card ${priority}`}>
                                        <div className="priority-count">{data.count}</div>
                                        <div className="priority-label">{priority.toUpperCase()}</div>
                                        <div className="priority-description">{data.description}</div>
                                    </div>
                                ))}
                            </div>

                            {/* Digital Twin */}
                            <div className="digital-twin glass-card">
                                <div className="section-header">
                                    <div>
                                        <div className="section-title">Digital Twin</div>
                                        <div className="section-subtitle">Real-time machine status</div>
                                    </div>
                                    <div className="section-action">View Details →</div>
                                </div>
                                <div className="machine-grid">
                                    {machines.map(machine => (
                                        <div key={machine.id} className={`machine-card ${machine.status}`}>
                                            <div className="machine-icon">{machine.icon}</div>
                                            <div className="machine-name">{machine.name}</div>
                                            <div className="machine-status">{machine.efficiency}% efficient</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* AI Assistant */}
                            <div className="ai-assistant glass-card">
                                <div className="section-header">
                                    <div>
                                        <div className="section-title">AI Assistant</div>
                                        <div className="section-subtitle">Ask me anything about your systems</div>
                                    </div>
                                </div>
                                <div className="chat-container">
                                    <div className="chat-messages">
                                        {messages.map((message, index) => (
                                            <div key={index} className={`message ${message.type}`}>
                                                {message.text}
                                            </div>
                                        ))}
                                        <div ref={chatEndRef} />
                                    </div>
                                    <div className="chat-input">
                                        <input
                                            type="text"
                                            value={inputMessage}
                                            onChange={(e) => setInputMessage(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSendMessage(inputMessage)}
                                            placeholder="Ask about critical issues, predictions, or specific machines..."
                                        />
                                        <button onClick={() => handleSendMessage(inputMessage)}>
                                            Send
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Predictive Analytics */}
                            <div className="predictive-analytics glass-card">
                                <div className="section-header">
                                    <div>
                                        <div className="section-title">Predictive Analytics</div>
                                        <div className="section-subtitle">Failure prediction and performance trends</div>
                                    </div>
                                    <div className="section-action">Export Data →</div>
                                </div>
                                <div className="chart-container">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={predictiveData}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="rgba(148, 163, 184, 0.1)" />
                                            <XAxis dataKey="time" stroke="#94a3b8" fontSize={12} />
                                            <YAxis stroke="#94a3b8" fontSize={12} />
                                            <Tooltip 
                                                contentStyle={{ 
                                                    backgroundColor: 'rgba(30, 41, 59, 0.9)',
                                                    border: '1px solid rgba(148, 163, 184, 0.2)',
                                                    borderRadius: '8px',
                                                    color: '#f1f5f9'
                                                }} 
                                            />
                                            <Area type="monotone" dataKey="pumpA" stackId="1" stroke="#ef4444" fill="rgba(239, 68, 68, 0.3)" />
                                            <Area type="monotone" dataKey="reactor2" stackId="1" stroke="#fb923c" fill="rgba(251, 146, 60, 0.3)" />
                                            <Area type="monotone" dataKey="conveyorB" stackId="1" stroke="#fbbf24" fill="rgba(251, 191, 36, 0.3)" />
                                            <Line type="monotone" dataKey="prediction" stroke="#3b82f6" strokeWidth={2} strokeDasharray="5 5" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Voice Control Button */}
                    <div className="voice-control">
                        <button 
                            className={`voice-button ${isListening ? 'listening' : ''}`}
                            onClick={startVoiceRecognition}
                        >
                            🎤
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<SmartHMI />, document.getElementById('root'));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaControl AI - Production Industrial Command Center</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.8.0/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Modern Glass Morphism */
        .glass-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        /* Header Styles */
        .header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text p {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .header-stats {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ai-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 100px;
            color: #22c55e;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .ai-pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.5); }
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 73px);
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .nav-section {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 1rem;
        }

        .nav-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #cbd5e1;
            font-size: 0.875rem;
        }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .nav-item.active {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-left: 3px solid #3b82f6;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 1.5rem;
        }

        /* Alert Priority Cards */
        .alert-grid {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .priority-card {
            padding: 1.25rem;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .priority-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .priority-card.critical {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .priority-card.critical::before {
            background: #ef4444;
        }

        .priority-card.high {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.1), rgba(251, 146, 60, 0.05));
            border: 1px solid rgba(251, 146, 60, 0.2);
        }

        .priority-card.high::before {
            background: #fb923c;
        }

        .priority-card.medium {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.05));
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .priority-card.medium::before {
            background: #fbbf24;
        }

        .priority-card.low {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .priority-card.low::before {
            background: #22c55e;
        }

        .priority-count {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .priority-label {
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 0.25rem;
        }

        .priority-description {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* Digital Twin */
        .digital-twin {
            grid-column: 1;
            grid-row: 2;
        }

        .machine-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .machine-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .machine-card.healthy {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.05));
            border: 2px solid rgba(34, 197, 94, 0.3);
        }

        .machine-card.warning {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(251, 191, 36, 0.05));
            border: 2px solid rgba(251, 191, 36, 0.3);
        }

        .machine-card.critical {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 2px solid rgba(239, 68, 68, 0.3);
            animation: criticalPulse 1s infinite;
        }

        @keyframes criticalPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }

        .machine-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .machine-name {
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .machine-status {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* AI Assistant */
        .ai-assistant {
            grid-column: 2;
            grid-row: 2;
        }

        .chat-container {
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.875rem;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .chat-input {
            padding: 1rem;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            gap: 0.5rem;
        }

        .chat-input input {
            flex: 1;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 0.75rem;
            color: #f1f5f9;
            font-size: 0.875rem;
        }

        .chat-input button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-input button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* Predictive Analytics */
        .predictive-analytics {
            grid-column: 1 / -1;
            grid-row: 3;
        }

        .chart-container {
            height: 250px;
            margin-top: 1rem;
        }

        /* Voice Control */
        .voice-control {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .voice-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .voice-button:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 32px rgba(59, 130, 246, 0.6);
        }

        .voice-button.listening {
            animation: voicePulse 1s infinite;
        }

        @keyframes voicePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
        }

        /* Loading and Connection Status */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .connection-status {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            z-index: 1000;
        }

        .connection-status.connected {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .digital-twin, .ai-assistant {
                grid-column: 1;
            }
            
            .predictive-analytics {
                grid-row: 4;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .alert-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .machine-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Section Headers */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .section-subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .section-action {
            font-size: 0.875rem;
            color: #3b82f6;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .section-action:hover {
            color: #60a5fa;
        }

        /* Error and Loading States */
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 1rem;
            color: #ef4444;
            margin: 1rem 0;
        }

        .loading-spinner {
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area } = Recharts;

        // Production Supabase Configuration
        const SUPABASE_URL = 'https://your-project.supabase.co';
        const SUPABASE_ANON_KEY = 'your-anon-key';
        const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1`;

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Production HMI Component
        const ProductionHMI = () => {
            const [selectedView, setSelectedView] = useState('dashboard');
            const [isListening, setIsListening] = useState(false);
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');
            const [currentTime, setCurrentTime] = useState(new Date());
            const [connectionStatus, setConnectionStatus] = useState('connecting');
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            
            // Real-time data states
            const [machines, setMachines] = useState([]);
            const [alerts, setAlerts] = useState({ critical: [], high: [], medium: [], low: [] });
            const [systemStats, setSystemStats] = useState({});
            const [sensorData, setSensorData] = useState([]);
            const [predictions, setPredictions] = useState([]);
            
            const chatEndRef = useRef(null);

            // Initialize connection and load data
            useEffect(() => {
                initializeConnection();
                setupRealtimeSubscriptions();
                
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Initialize database connection
            const initializeConnection = async () => {
                try {
                    setIsLoading(true);
                    setError(null);
                    
                    // Load initial data
                    await Promise.all([
                        loadMachines(),
                        loadAlerts(),
                        loadSystemStats(),
                        loadSensorData(),
                        loadPredictions()
                    ]);
                    
                    setConnectionStatus('connected');
                    setIsLoading(false);
                } catch (err) {
                    console.error('Connection error:', err);
                    setError('Failed to connect to database. Please check your configuration.');
                    setConnectionStatus('disconnected');
                    setIsLoading(false);
                }
            };

            // Setup real-time subscriptions
            const setupRealtimeSubscriptions = () => {
                // Subscribe to machine changes
                const machinesSubscription = supabase
                    .channel('machines')
                    .on('postgres_changes', 
                        { event: '*', schema: 'public', table: 'machines' },
                        (payload) => {
                            console.log('Machine change:', payload);
                            loadMachines();
                        }
                    )
                    .subscribe();

                // Subscribe to alert changes
                const alertsSubscription = supabase
                    .channel('alerts')
                    .on('postgres_changes', 
                        { event: '*', schema: 'public', table: 'alerts' },
                        (payload) => {
                            console.log('Alert change:', payload);
                            loadAlerts();
                        }
                    )
                    .subscribe();

                // Subscribe to sensor data changes
                const sensorSubscription = supabase
                    .channel('sensor_readings')
                    .on('postgres_changes', 
                        { event: 'INSERT', schema: 'public', table: 'sensor_readings' },
                        (payload) => {
                            console.log('New sensor reading:', payload);
                            loadSensorData();
                        }
                    )
                    .subscribe();

                return () => {
                    supabase.removeChannel(machinesSubscription);
                    supabase.removeChannel(alertsSubscription);
                    supabase.removeChannel(sensorSubscription);
                };
            };

            // Load machines from database
            const loadMachines = async () => {
                try {
                    const { data, error } = await supabase
                        .from('machines')
                        .select(`
                            id, name, type, status, efficiency_percentage, 
                            location_x, location_y, last_maintenance,
                            alerts(id, title, severity, status, created_at)
                        `)
                        .order('updated_at', { ascending: false });

                    if (error) throw error;
                    setMachines(data || []);
                } catch (err) {
                    console.error('Error loading machines:', err);
                }
            };

            // Load alerts from database
            const loadAlerts = async () => {
                try {
                    const response = await fetch(`${EDGE_FUNCTION_URL}/real-time-data/alerts`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    if (data.alerts) {
                        setAlerts(data.alerts);
                    }
                } catch (err) {
                    console.error('Error loading alerts:', err);
                }
            };

            // Load system statistics
            const loadSystemStats = async () => {
                try {
                    const response = await fetch(`${EDGE_FUNCTION_URL}/real-time-data/system-stats`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    if (data.stats) {
                        setSystemStats(data.stats);
                    }
                } catch (err) {
                    console.error('Error loading system stats:', err);
                }
            };

            // Load sensor data
            const loadSensorData = async () => {
                try {
                    const response = await fetch(`${EDGE_FUNCTION_URL}/real-time-data/sensor-data`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    if (data.readings) {
                        setSensorData(data.readings.slice(0, 50)); // Keep last 50 readings
                    }
                } catch (err) {
                    console.error('Error loading sensor data:', err);
                }
            };

            // Load predictions
            const loadPredictions = async () => {
                try {
                    const response = await fetch(`${EDGE_FUNCTION_URL}/real-time-data/predictions`, {
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    if (data.predictions) {
                        setPredictions(data.predictions);
                    }
                } catch (err) {
                    console.error('Error loading predictions:', err);
                }
            };

            // Send message to AI assistant
            const sendAIMessage = async (message) => {
                if (!message.trim()) return;

                const userMessage = { type: 'user', text: message };
                setMessages(prev => [...prev, userMessage]);

                try {
                    const response = await fetch(`${EDGE_FUNCTION_URL}/ai-assistant`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            userId: 'demo-user', // In production, get from auth
                            sessionId: 'demo-session'
                        })
                    });

                    const data = await response.json();
                    
                    if (data.response) {
                        const aiMessage = { type: 'ai', text: data.response };
                        setMessages(prev => [...prev, aiMessage]);
                    }
                } catch (err) {
                    console.error('Error sending AI message:', err);
                    const errorMessage = { 
                        type: 'ai', 
                        text: 'Sorry, I encountered an error. Please try again.' 
                    };
                    setMessages(prev => [...prev, errorMessage]);
                }

                setInputMessage('');
            };

            // Voice recognition
            const startVoiceRecognition = () => {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    
                    recognition.continuous = false;
                    recognition.interimResults = false;
                    
                    recognition.onstart = () => setIsListening(true);
                    recognition.onend = () => setIsListening(false);
                    
                    recognition.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInputMessage(transcript);
                        sendAIMessage(transcript);
                    };
                    
                    recognition.start();
                } else {
                    alert('Voice recognition is not supported in your browser. Please use Chrome or Edge.');
                }
            };

            // Acknowledge alert
            const acknowledgeAlert = async (alertId) => {
                try {
                    const { error } = await supabase
                        .from('alerts')
                        .update({ 
                            status: 'acknowledged',
                            acknowledged_at: new Date().toISOString()
                        })
                        .eq('id', alertId);

                    if (error) throw error;
                    
                    // Refresh alerts
                    loadAlerts();
                } catch (err) {
                    console.error('Error acknowledging alert:', err);
                }
            };

            // Auto-scroll chat
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            // Loading state
            if (isLoading) {
                return (
                    <div className="loading">
                        <div>
                            <div className="loading-spinner"></div>
                            <p>Connecting to NexaControl AI...</p>
                        </div>
                    </div>
                );
            }

            // Error state
            if (error) {
                return (
                    <div className="loading">
                        <div className="error-message">
                            <h3>Connection Error</h3>
                            <p>{error}</p>
                            <button onClick={initializeConnection} style={{
                                marginTop: '1rem',
                                padding: '0.5rem 1rem',
                                background: '#3b82f6',
                                color: 'white',
                                border: 'none',
                                borderRadius: '4px',
                                cursor: 'pointer'
                            }}>
                                Retry Connection
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {/* Connection Status */}
                    <div className={`connection-status ${connectionStatus}`}>
                        {connectionStatus === 'connected' ? '🟢 Connected to Database' : '🔴 Disconnected'}
                    </div>

                    {/* Header */}
                    <header className="glass-header header">
                        <div className="logo-section">
                            <div className="logo">NC</div>
                            <div className="brand-text">
                                <h1>NexaControl AI</h1>
                                <p>Production Industrial Command Center</p>
                            </div>
                        </div>
                        
                        <div className="header-stats">
                            <div className="stat-item">
                                <div className="stat-value">{systemStats.averageEfficiency || 0}%</div>
                                <div className="stat-label">Efficiency</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{systemStats.healthyMachines || 0}/{systemStats.totalMachines || 0}</div>
                                <div className="stat-label">Systems Online</div>
                            </div>
                            <div className="stat-item">
                                <div className="stat-value">{systemStats.criticalAlerts || 0}</div>
                                <div className="stat-label">Critical</div>
                            </div>
                            <div className="ai-status">
                                <div className="ai-pulse"></div>
                                AI Active
                            </div>
                        </div>
                    </header>

                    <div className="main-container">
                        
                        {/* Sidebar */}
                        <aside className="sidebar">
                            <div className="nav-section">
                                <div className="nav-title">Real-Time Monitoring</div>
                                <div className={`nav-item ${selectedView === 'dashboard' ? 'active' : ''}`} onClick={() => setSelectedView('dashboard')}>
                                    📊 Dashboard
                                </div>
                                <div className={`nav-item ${selectedView === 'machines' ? 'active' : ''}`} onClick={() => setSelectedView('machines')}>
                                    🏭 Machines
                                </div>
                                <div className={`nav-item ${selectedView === 'alerts' ? 'active' : ''}`} onClick={() => setSelectedView('alerts')}>
                                    🚨 Alerts ({alerts.critical?.length || 0})
                                </div>
                            </div>
                            
                            <div className="nav-section">
                                <div className="nav-title">AI Intelligence</div>
                                <div className={`nav-item ${selectedView === 'assistant' ? 'active' : ''}`} onClick={() => setSelectedView('assistant')}>
                                    🤖 AI Assistant
                                </div>
                                <div className={`nav-item ${selectedView === 'predictive' ? 'active' : ''}`} onClick={() => setSelectedView('predictive')}>
                                    🔮 Predictions
                                </div>
                            </div>
                        </aside>

                        {/* Main Content */}
                        <main className="main-content">
                            
                            {/* AI Alert Prioritization */}
                            <div className="alert-grid">
                                <div className={`priority-card critical`} onClick={() => setSelectedView('alerts')}>
                                    <div className="priority-count">{alerts.critical?.length || 0}</div>
                                    <div className="priority-label">CRITICAL</div>
                                    <div className="priority-description">Immediate action required</div>
                                </div>
                                <div className={`priority-card high`} onClick={() => setSelectedView('alerts')}>
                                    <div className="priority-count">{alerts.high?.length || 0}</div>
                                    <div className="priority-label">HIGH</div>
                                    <div className="priority-description">Address within 1 hour</div>
                                </div>
                                <div className={`priority-card medium`} onClick={() => setSelectedView('alerts')}>
                                    <div className="priority-count">{alerts.medium?.length || 0}</div>
                                    <div className="priority-label">MEDIUM</div>
                                    <div className="priority-description">Schedule maintenance</div>
                                </div>
                                <div className={`priority-card low`} onClick={() => setSelectedView('alerts')}>
                                    <div className="priority-count">{alerts.low?.length || 0}</div>
                                    <div className="priority-label">LOW</div>
                                    <div className="priority-description">Monitor only</div>
                                </div>
                            </div>

                            {/* Digital Twin */}
                            <div className="digital-twin glass-card">
                                <div className="section-header">
                                    <div>
                                        <div className="section-title">Digital Twin</div>
                                        <div className="section-subtitle">Real-time machine status</div>
                                    </div>
                                    <div className="section-action">View Details →</div>
                                </div>
                                <div className="machine-grid">
                                    {machines.map(machine => (
                                        <div key={machine.id} className={`machine-card ${machine.status}`}>
                                            <div className="machine-icon">
                                                {machine.type === 'pump' ? '⚙️' : 
                                                 machine.type === 'reactor' ? '⚗️' :
                                                 machine.type === 'conveyor' ? '🔄' :
                                                 machine.type === 'motor' ? '⚡' : '📡'}
                                            </div>
                                            <div className="machine-name">{machine.name}</div>
                                            <div className="machine-status">{machine.efficiency_percentage}% efficient</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* AI Assistant */}
                            <div className="ai-assistant glass-card">
                                <div className="section-header">
                                    <div>
                                        <div className="section-title">AI Assistant</div>
                                        <div className="section-subtitle">Ask me anything about your systems</div>
                                    </div>
                                </div>
                                <div className="chat-container">
                                    <div className="chat-messages">
                                        {messages.length === 0 && (
                                            <div className="message ai">
                                                Hello! I'm your AI assistant. I can help you analyze system performance and recommend actions. Try asking "What are critical issues?"
                                            </div>
                                        )}
                                        {messages.map((message, index) => (
                                            <div key={index} className={`message ${message.type}`}>
                                                {message.text}
                                            </div>
                                        ))}
                                        <div ref={chatEndRef} />
                                    </div>
                                    <div className="chat-input">
                                        <input
                                            type="text"
                                            value={inputMessage}
                                            onChange={(e) => setInputMessage(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && sendAIMessage(inputMessage)}
                                            placeholder="Ask about critical issues, predictions, or specific machines..."
                                        />
                                        <button onClick={() => sendAIMessage(inputMessage)}>
                                            Send
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Predictive Analytics */}
                            <div className="predictive-analytics glass-card">
                                <div className="section-header">
                                    <div>
                                        <div className="section-title">Predictive Analytics</div>
                                        <div className="section-subtitle">Failure prediction and performance trends</div>
                                    </div>
                                    <div className="section-action">Export Data →</div>
                                </div>
                                <div className="chart-container">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={sensorData}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="rgba(148, 163, 184, 0.1)" />
                                            <XAxis dataKey="timestamp" stroke="#94a3b8" fontSize={12} />
                                            <YAxis stroke="#94a3b8" fontSize={12} />
                                            <Tooltip 
                                                contentStyle={{ 
                                                    backgroundColor: 'rgba(30, 41, 59, 0.9)',
                                                    border: '1px solid rgba(148, 163, 184, 0.2)',
                                                    borderRadius: '8px',
                                                    color: '#f1f5f9'
                                                }} 
                                            />
                                            <Area type="monotone" dataKey="value" stroke="#3b82f6" fill="rgba(59, 130, 246, 0.3)" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Voice Control Button */}
                    <div className="voice-control">
                        <button 
                            className={`voice-button ${isListening ? 'listening' : ''}`}
                            onClick={startVoiceRecognition}
                        >
                            🎤
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<ProductionHMI />, document.getElementById('root'));
    </script>
</body>
</html>
